schema_version: 1
id: street-revival-art-direction
status: approved-for-renderer
story_ref: demos/html/street-revival/source/content-manifest.json
brief:
  visual_genre: documentary-field-guide
  narrative_metaphor: 把一個被繞開的街角當成一張共同編寫的生活地圖，沿著觀察、試作與回看重新接回使用與責任。
  signature_move:
    name: neighborhood-index-spine
    concept_link: 用一條窄邊索引把街角編號、觀察證據與下一步責任連成同一條閱讀軸。
    allowed_variations: [rule, route, ledger, milestone]
    minimum_presence: 至少出現在 hero、index-or-map、evidence、relationship 與 pause-or-close。
  spatial_rule:
    primary_anchor: left-axis
    reading_axis: editorial-columns
    crop_logic: frame-within-frame
    whitespace_logic: 左側保留街角索引，主要內容沿同一條生活路徑收合，讓留白成為共同判斷的空間。
    content_alignment: left
  edge_behavior: structural-index
  typography_role:
    primary_role: index
    hierarchy_method: [size, weight, position, spacing]
    family_policy: serif-sans-pair
    maximum_families: 2
    ai_minimum_visual_text_px: 36
  color_behavior:
    primary_job: documentary
    accent_job: classification
    accent_area_limit: 一般頁面不超過視覺面積 12%，只用於路徑、狀態與回看節點。
  forbidden_cliches:
    - equal-rounded-card-wall
    - generic-purple-orange-gradient
    - floating-pills
    - fake-dashboard
    - decorative-random-curves
reference_packet:
  official_cases:
    - title: Tactical Urbanism Guide
      original_author_or_studio: Street Plans
      official_url: https://tacticalurbanismguide.com/guide/
      borrowed_method: 借用小尺度、可逆試作與現場回看的方法，不複製其視覺或案例內容。
    - title: The City at Eye Level
      original_author_or_studio: STIPO
      official_url: https://thecityateyelevel.com/about/
      borrowed_method: 借用從日常步行與街道邊界觀察公共生活的切入方式。
  cross_domain_reference:
    type: documentary-field-guide
    title: 田野筆記與路徑索引
    source_url: https://tacticalurbanismguide.com/guide/
    borrowed_method: 讓每個視覺標記都對應觀察、決策或責任，而非只作氣氛裝飾。
  reusable_asset_sources:
    - catalog_id: project-native-css-geometry
      source_url: https://developer.mozilla.org/en-US/docs/Web/CSS
      license_status: official documentation; no copied assets
  anti_reference:
    description: 把街道圖示、植物與彩色圓點當成氣氛貼紙，讓真正的使用阻力與維護責任被裝飾掩蓋。
    failure_risk: 視覺看似友善，卻失去路徑、證據與共同行動的閱讀關係。
  translation_note: 只借用可逆試作、步行觀察與索引閱讀的方法；所有文案與視覺均為虛構示範。
asset_family:
  primary_family: project-native-css-geometry
  secondary_family: typographic-index-marks
  allowed_roles: [identity-motif, utility-icon]
  maximum_families: 2
  provenance_required: true
  no_mixed_icon_families: true
scene_grammar:
  mode: full-deck
  scenes:
    - {slide_id: '01', role: hero, visual_intensity: 5, primary_focus: 被繞開的街角其實是共同生活的入口, signature_move_variant: rule}
    - {slide_id: '02', role: index-or-map, visual_intensity: 2, primary_focus: 六個章節的共同閱讀路徑, signature_move_variant: ledger}
    - {slide_id: '03', role: relationship, visual_intensity: 4, primary_focus: 三個先做方向, signature_move_variant: route}
    - {slide_id: '04', role: relationship, visual_intensity: 3, primary_focus: 從被忽略到共同照顧, signature_move_variant: split}
    - {slide_id: '05', role: evidence, visual_intensity: 4, primary_focus: 六處觀察與三條日常路徑, signature_move_variant: ledger}
    - {slide_id: '06', role: relationship, visual_intensity: 5, primary_focus: 從走訪到回看的工作流程, signature_move_variant: route}
    - {slide_id: '07', role: evidence, visual_intensity: 4, primary_focus: 第一個試作點的優先順序, signature_move_variant: milestone}
    - {slide_id: '08', role: evidence, visual_intensity: 3, primary_focus: 30 天共同回看節奏, signature_move_variant: rule}
    - {slide_id: '09', role: pause-or-close, visual_intensity: 2, primary_focus: 街角不是空白只是還沒有被一起照顧, signature_move_variant: ledger}
    - {slide_id: '10', role: pause-or-close, visual_intensity: 1, primary_focus: 先把一個街角做對再讓整條路重新有人使用, signature_move_variant: milestone}
renderer_handoff:
  image2:
    theme_candidates: [grainy-editorial]
    layout_sequence: &street_revival_layouts
      - cover-center-title-edge-decor
      - toc-6-panel-rows
      - strategic-priorities
      - before-after
      - heat-map
      - timeline-vertical
      - matrix-4quadrant
      - multi-line-chart
      - quote-focus
      - title-center
  html:
    theme_candidates: [neighborhood-newsroom-proof]
    layout_sequence: *street_revival_layouts
  pptx:
    theme_candidates: [grainy-editorial]
    layout_sequence: *street_revival_layouts
approval:
  machine:
    status: pass
    checked_at: '2026-08-18'
  human:
    status: approved
    approved_by: NESA Slide internal demo gate
    approved_at: '2026-08-18'
    notes: 三頁 pilot（cover、一般內容頁、資訊密集頁）已完成方向檢查；此案例為乾淨 new-deck 示範，不讀 Preset 範例內容。
perceptual_qa:
  required_checks: [motivated-decoration, asset-family-consistency, semantic-card-boundary, signature-move-presence, scene-rhythm, visual-intensity-curve]
  notes: 使用 pattern-only；無照片、Logo 或外部素材進入 renderer runtime。
  final_decision: human
