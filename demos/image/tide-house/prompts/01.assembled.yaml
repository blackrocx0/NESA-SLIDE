page_type_and_mood:
  prompt: "16:9 圖片式簡報封面；溫暖編輯攝影與安靜海岸慢旅，像一本沿海旅誌的開場。"
visual_base_2a:
  background: {style: "清晨海岸照片，霧藍海面、暖白砂岩、低飽和自然光", texture: "細緻紙張顆粒與輕微底片質地"}
  typography: {heading: "繁體中文 Noto Serif TC，高對比大標", body: "繁體中文 Noto Sans TC，細緻小字"}
  color_system: {primary: "#2A2521", secondary: "#8E7A6A", accent: "#C3A58D", support: "#D8C6B8"}
corner_decoration_2b:
  rule: "一條細窄潮線沿左側影像與右側紙面交界，像潮水剛退。"
  top_left: {element: "微小頁碼 01", treatment: "低對比暖褐色"}
  top_right: {element: "空白", treatment: "不放 Logo、不放圖示"}
  bottom_left: {element: "影像裁切與紙邊", treatment: "左側滿高出血"}
  bottom_right: {element: "NESA Slide demo", treatment: "小型細字"}
layout_description:
  structure: "左 40% 滿高海岸照片，右 48% 暖白文字欄；主標『潮汐旅宿』兩行，副標『把海岸的慢，住進日常』，下方小字『海岸慢旅品牌概念｜NESA Slide demo』。"
content:
  title: "潮汐旅宿"
  subtitle: "把海岸的慢，住進日常"
  body: "海岸慢旅品牌概念｜NESA Slide demo"
safe_zone_constraints:
  hard_constraint: "所有繁體中文字必須保持清楚、正確、可讀；右側文字只在暖白欄內，左側影像不得侵入文字安全區；不要 Logo、不要水印、不要額外英文。"
closing_design_intent:
  prompt: "像推開一扇面向海的木窗：畫面先讓人感到潮氣與光，再讀到品牌名字。"
