layout_description:
  structure: "上方主標『三個體驗支柱，讓慢下來有具體形狀』；下方三欄以留白分隔：『看見｜讓光線成為房間的一部分』、『走近｜把海岸變成可漫遊的路』、『留下｜把一晚變成可帶走的記憶』；底部小結。"
content:
  title: "三個體驗支柱，讓慢下來有具體形狀"
  subtitle: "看見、走近、留下，構成潮汐旅宿的體驗骨架。"
  modules:
    - {title: "看見", body: "讓光線成為房間的一部分"}
    - {title: "走近", body: "把海岸變成可漫遊的路"}
    - {title: "留下", body: "把一晚變成可帶走的記憶"}
  takeaway: "慢旅需要被設計成可感知的行為，而不是一句形容詞。"
safe_zone_constraints:
  hard_constraint: "三個模組必須保持平行閱讀、文字不超出安全區；不做等寬圓角卡片牆、不放 icon、不放 Logo。"
closing_design_intent:
  prompt: "這頁是全案的骨架：清楚、有節奏，但仍像紙面上的三個可呼吸段落。"
