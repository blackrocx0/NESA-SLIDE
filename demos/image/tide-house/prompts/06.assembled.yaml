layout_description:
  structure: "主標『日光與潮聲，決定空間的節奏』；四個時間段：『清晨｜薄光穿過紗簾』、『午後｜風把影子推進室內』、『傍晚｜潮聲成為公共空間的背景』、『夜裡｜一盞低燈讓人願意留下』；底部一句結論。"
content:
  title: "日光與潮聲，決定空間的節奏"
  subtitle: "房間不追求每一刻都熱鬧，而是讓感官有先後。"
  milestones: ["清晨｜薄光穿過紗簾", "午後｜風把影子推進室內", "傍晚｜潮聲成為公共空間的背景", "夜裡｜一盞低燈讓人願意留下"]
  takeaway: "空間的差異，不在設備清單，而在感官節奏的安排。"
safe_zone_constraints:
  hard_constraint: "每一段文字都要可讀且不互相重疊；光影色帶只能承擔節奏，不生成任何假的數據或標尺；不放 Logo。"
closing_design_intent:
  prompt: "把『空間設計』翻譯成身體會感受到的時間順序，而不是設備規格表。"
