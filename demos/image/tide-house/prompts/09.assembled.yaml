page_type_and_mood:
  prompt: "16:9 圖片式簡報記憶延伸頁；三個短句沿底部潮線展開，像旅人把海岸帶回日常的三個小物件。"
visual_base_2a:
  background: {style: "暖白紙面，底部有霧藍與沙色的三段自然色面", texture: "紙張與淡淡海風痕跡"}
  typography: {heading: "繁體中文 Noto Serif TC", body: "繁體中文 Noto Sans TC，三個記憶標題粗體"}
  color_system: {primary: "#2A2521", secondary: "#8E7A6A", accent: "#C3A58D", support: "#A7B9B5"}
corner_decoration_2b:
  rule: "底部潮線從左至右連過三個記憶模組，線條在每個模組前後略有間距。"
  top_left: {element: "09", treatment: "頁碼"}
  top_right: {element: "帶走的記憶", treatment: "細字"}
  bottom_left: {element: "空白", treatment: "不放圖示"}
  bottom_right: {element: "潮汐旅宿", treatment: "細字"}
layout_description:
  structure: "主標『把一晚，延伸成三種可帶走的記憶』；三欄短句：『一張海圖｜回到城市仍能辨認那段路』、『一段聲音｜在忙碌時想起潮聲』、『一個習慣｜每週留一晚不排滿』；底部小結。"
content:
  title: "把一晚，延伸成三種可帶走的記憶"
  subtitle: "離開之後，旅宿仍以輕巧的方式留在日常。"
  modules:
    - {title: "一張海圖", body: "回到城市仍能辨認那段路"}
    - {title: "一段聲音", body: "在忙碌時想起潮聲"}
    - {title: "一個習慣", body: "每週留一晚不排滿"}
  takeaway: "旅宿的延伸價值，是讓慢成為旅人日後可重複的習慣。"
safe_zone_constraints:
  hard_constraint: "三個模組保持清楚分隔與閱讀順序；不做制式卡片牆，不放 icon、Logo 或偽造成效數字。"
closing_design_intent:
  prompt: "讓這頁像旅人離開後口袋裡的三件小物：輕、實用、會在日後被再次想起。"
