layout_description:
  structure: "滿版暮色海岸；左側約 42% 半透明暖褐色塊，內含大標『潮來時，留一盞燈。』、副標『下一次，讓時間帶你回到海邊。』、小字『潮汐旅宿｜海岸慢旅品牌概念』與『NESA Slide demo · fictional case』。"
content:
  title: "潮來時，留一盞燈。"
  subtitle: "下一次，讓時間帶你回到海邊。"
  body: "潮汐旅宿｜海岸慢旅品牌概念\nNESA Slide demo · fictional case"
