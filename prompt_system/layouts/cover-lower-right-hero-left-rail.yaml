id: cover-lower-right-hero-left-rail
display_name: 封面 左側分離文字軌・右下主標
media_requirement: no-image
family: 封面類

safe_area: [10, 10, 90, 90]

slots:
  - id: title
    region: [56, 66, 32, 14]
    weight: hero
    alignment: right
    note: 主標位於右下，形成獨立的主要錨點。

  - id: subtitle
    region: [12, 17, 31, 8]
    weight: secondary
    alignment: left
    note: 副標位於左上，作為左側文字軌的上端。

  - id: meta
    region: [12, 80, 26, 5]
    weight: tertiary
    alignment: left
    optional: true
    note: 短 metadata 位於左下，與副標共用左側起點。

alignment_rules:
  - "subtitle.left == meta.left == 12%"
  - "subtitle and meta stay separated at the top and bottom of the left rail"
  - "title.right == 88% and remains independent from the left rail"
  - "all glyphs remain inside safe_area"

classification_rules:
  content_role: cover title + subtitle + optional metadata
  title_position: lower-right
  subtitle_position: upper-left
  metadata_position: lower-left

decoration:
  design_zone:
    region: [33, 26, 34, 36]
    protected_slots: [title, subtitle, meta]
    rule: >
      An optional focal treatment may occupy the central zone. It must preserve the open
      separation between the left text rail and the lower-right title.

content_capacity:
  title: 1–2 short lines
  subtitle: 1–2 short lines
  meta: one short line

visual_balance:
  method: split-left-rail-with-lower-right-anchor
  description: >
    Two small left-side text blocks form a vertically split rail, while a stronger
    lower-right title anchors the opposite side across an open central field.
