id: cover-mid-right-column-meta-upper-left
display_name: 封面 左側焦點欄・右側文字欄
media_requirement: no-image
family: 封面類

safe_area: [10, 10, 90, 90]

slots:
  - id: title
    region: [53, 32, 34, 25]
    weight: hero
    alignment: left
    note: 主標位於右側中段，可使用一至三行。

  - id: subtitle
    region: [60, 67, 27, 7]
    weight: secondary
    alignment: right
    note: 副標位於右側下段，以不同寬度形成層級。

  - id: meta
    region: [12, 14, 22, 5]
    weight: tertiary
    alignment: left
    optional: true
    note: 短 metadata 位於左上，與右側文字欄分離。

alignment_rules:
  - "title and subtitle remain inside the right text column"
  - "title.left == 53%; subtitle.right == title.right == 87%"
  - "meta stays above the left focal field and never joins the title axis"
  - "all glyphs remain inside safe_area"

classification_rules:
  content_role: cover title + subtitle + optional metadata
  title_position: middle-right
  subtitle_position: lower-right
  metadata_position: upper-left

decoration:
  design_zone:
    region: [10, 20, 35, 65]
    protected_slots: [title, subtitle, meta]
    rule: >
      The left column is an optional focal field. Its treatment must remain within the
      column and must not cross into the right text column or upper-left metadata.

content_capacity:
  title: 1–3 short lines
  subtitle: 1–2 short lines
  meta: one short line

visual_balance:
  method: left-focal-column-right-text-column
  description: >
    A tall left focal field balances a staggered right-side text system. The upper-left
    metadata provides a small bridge while remaining outside the main title column.
